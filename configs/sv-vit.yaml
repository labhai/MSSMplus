BASE_PATH: "" # "/analysis/project/exp_name"
RESULT_PATH: "" # "/results/project/fwhm"
INFO_PATH: "" # "/dataset/All/info/info.csv"
DATASETS:
  - "All"

# Binary labels must match the LABEL_MAP used to generate MSSM+ maps.
# AD/CN is the default; other binary comparisons can be configured here.
LABEL_MAP:
  CN: 0
  AD: 1

# Fixed production input directory created by pls_age_correction.py.
MSSMPLUS_DIRNAME: "MSSMplus"

# SSVM: 2,560 patches x 147 faces x 3 vertex values.
SSVM_INDEX_PATH: "data/ssvm_ico7_sub_ico3.npy"
HEMISPHERE_VERTICES: 163842

CUDA_DEVICE: 0
SEED: 42
EPOCHS: 400
PATIENCE: 40
# Classification uses unsmoothed age-corrected residual maps.
WANDB_PROJECT: "MSSMplus-SVViT"
# Set to "online" only when experiment uploads are wanted.
WANDB_MODE: "disabled"

DATALOADER_CONFIG:
  batch_size: 16
  num_workers: 4

MODEL_CONFIG:
  dim: 96
  depth: 6
  heads: 6
  mlp_dim: 384
  pool: "cls"
  num_patches: 2560
  num_classes: 1
  num_channels: 1
  num_vertices: 441
  dim_head: 16
  dropout: 0.3
  emb_dropout: 0.3

OPTIMIZER_CONFIG:
  lr: 5e-5
  weight_decay: 5e-2
TRAIN_SPLIT:
  cv_folds: 4
  valid_size: 0.1
