# Target AD/CN cohort. Layout: <DATA_DIR>/<Split>/<Group>/<Subject>/
DATA_DIR: ""
INFO_PATH: ""
MAP_DIR: ""

SPLITS:
  - "All"
GROUPS:
  - "AD"
  - "CN"
# Binary diagnosis labels used by vertex-wise PLS-DA. Change both GROUPS and
# LABEL_MAP to reuse the pipeline for another binary comparison (for example,
# ADHD/HC). The group mapped to 0 is also used as the healthy age-reference
# group when CORRECTION is enabled.
LABEL_MAP:
  CN: 0
  AD: 1

# fsaverage resolution (163,842 vertices per hemisphere).
N_VERTEX: 327684
OUTPUT_NAME: "MSSMplus"

# Fixed production flow: 8 GWCs + CT + Sulc + Curv -> vertex-wise PLS-DA.
# LH/RH pairs correspond to 0.5/1.0-mm WM and 20/40/60/80% GM depths.
GWR_PREFIX: "mri/GWC/reg_surf2fsaverage"
GWR_TYPES:
  - "lh_subcortwm-0.5divgm.2.nii.gz"
  - "rh_subcortwm-0.5divgm.2.nii.gz"
  - "lh_subcortwm-1divgm.2.nii.gz"
  - "rh_subcortwm-1divgm.2.nii.gz"
  - "lh_subcortwm-0.5divgm.4.nii.gz"
  - "rh_subcortwm-0.5divgm.4.nii.gz"
  - "lh_subcortwm-1divgm.4.nii.gz"
  - "rh_subcortwm-1divgm.4.nii.gz"
  - "lh_subcortwm-0.5divgm.6.nii.gz"
  - "rh_subcortwm-0.5divgm.6.nii.gz"
  - "lh_subcortwm-1divgm.6.nii.gz"
  - "rh_subcortwm-1divgm.6.nii.gz"
  - "lh_subcortwm-0.5divgm.8.nii.gz"
  - "rh_subcortwm-0.5divgm.8.nii.gz"
  - "lh_subcortwm-1divgm.8.nii.gz"
  - "rh_subcortwm-1divgm.8.nii.gz"
THICK_PREFIX: "surf/reg_surf2fsaverage"
SURFACE_PREFIX: "surf"

MEDIALWALL_MASKS:
  - "fsaverage/label/lh.Medial_wall.label"
  - "fsaverage/label/rh.Medial_wall.label"

# Fit the polynomial age model on an independent 150-CN cohort and residualize
# the PLS-DA score. For another binary comparison, the
# reference cohort is the group mapped to 0 in LABEL_MAP. It must use the same
# directory layout and the same fixed eleven input features.
CORRECTION: true
AGE_REFERENCE_DATA_DIR: ""
AGE_REFERENCE_INFO_PATH: ""
AGE_REFERENCE_SPLIT: "AgeReference"
EXPECTED_AGE_REFERENCE_SIZE: 150
AGE_REFERENCE_STRATIFY_COLUMNS:
  - "Vendor"
  - "Sex"
EXPECTED_AGE_REFERENCE_STRATA: 6
EXPECTED_AGE_REFERENCE_PER_STRATUM: 25
POLYNOMIAL_DEGREE: 1

# Small vertex blocks avoid copying a full cortical array to every worker.
VERTEX_BLOCK_SIZE: 512
MAX_WORKERS: 8
